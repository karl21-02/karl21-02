name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *" # Daily at 15:17 Asia/Seoul
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "README.md"
      - "profile.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: read

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_PROFILE_USER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install calendar dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Check contribution parsing and streak calculations
        run: python -m unittest discover -s tests -v
      - name: Read actual public contribution data
        run: python scripts/fetch_contributions.py
      - name: Render profile art
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py
      - name: Commit generated data and art
        run: |
          git add data/contributions.json contrib-heatmap.svg info-card.svg
          if git diff --cached --quiet; then
            echo 'Profile art is already current.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: refresh profile art [skip ci]'
          git push
